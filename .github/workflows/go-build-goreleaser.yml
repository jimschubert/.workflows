name: Go Build and Publish
# See https://docs.github.com/en/actions/sharing-automations/creating-workflow-templates-for-your-organization
# See https://github.blog/developer-skills/github/using-reusable-workflows-github-actions/
# When a reusable workflow is triggered by a caller workflow, the github context is always associated with the caller workflow. The called workflow is automatically granted access to github.token and secrets.GITHUB_TOKEN.
on:
  workflow_call:
    inputs:
      go-version-file:
        description: 'Path to go.mod file for Go version'
        required: false
        type: string
        default: 'go.mod'
      golangci-lint-version:
        description: 'Version of golangci-lint to use'
        required: false
        type: string
        default: 'v2.7.2'

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-go-build-goreleaser
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/go-build.yml
    with:
      go-version-file: ${{ inputs.go-version-file }}
      golangci-lint-version: ${{ inputs.golangci-lint-version }}
    secrets: inherit

  publish:
    needs: build
    if: needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      # goreleaser v4 removed the auto-snapshot feature, so we need to explicitly define the flag for non-tag builds
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "flags=--snapshot" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Check for Docker Environment
        shell: bash
        id: has-docker
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ ! -z "${DOCKER_PASSWORD}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Set up QEMU
        if: success() && startsWith(github.ref, 'refs/tags/v') && steps.has-docker.outputs.available == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: success() && startsWith(github.ref, 'refs/tags/v') && steps.has-docker.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        if: success() && startsWith(github.ref, 'refs/tags/v') && steps.has-docker.outputs.available == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ env.flags }}

      - name: Cleanup
        if: always()
        run: |
          rm -f ${HOME}/.docker/config.json
