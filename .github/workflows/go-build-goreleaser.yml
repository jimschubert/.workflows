name: Go Build and Publish
# See https://docs.github.com/en/actions/sharing-automations/creating-workflow-templates-for-your-organization
# See https://github.blog/developer-skills/github/using-reusable-workflows-github-actions/
# When a reusable workflow is triggered by a caller workflow, the github context is always associated with the caller workflow. The called workflow is automatically granted access to github.token and secrets.GITHUB_TOKEN.
on:
  workflow_call:
    inputs:
      go-version-file:
        description: 'Path to go.mod file for Go version'
        required: false
        type: string
        default: 'go.mod'
      golangci-lint-version:
        description: 'Version of golangci-lint to use'
        required: false
        type: string
        default: 'v2.7.2'
      changelog-config:
        description: 'Path to beast-changelog config file (changelog generated only if file exists)'
        required: false
        type: string
        default: '.github/changelog.yml'
      # NOTE: any private repo must set this to '', as attestations are only available for public repos (unless you have GitHub Enterprise)
      artifact-checksums-path:
        description: 'Path to the artifacts checksum file (default: dist/checksums.txt)'
        required: false
        default: 'dist/checksums.txt'
        type: string
      docker-digests-path:
        description: 'Path to the docker digests file (default: dist/digests.txt)'
        required: false
        default: 'dist/digests.txt'
        type: string

permissions:
  contents: write
  packages: write
  # id-token is required for attestation (signing)
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-go-build-goreleaser
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/go-build.yml
    with:
      go-version-file: ${{ inputs.go-version-file }}
      golangci-lint-version: ${{ inputs.golangci-lint-version }}
    secrets: inherit

  publish:
    needs: build
    if: needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      # goreleaser v4 removed the auto-snapshot feature, so we need to explicitly define the flag for non-tag builds
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "flags=--snapshot" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          check-latest: true

      - name: Install common dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          if [ -f "go.mod" ] && grep -q "fyne.io/fyne/v2" go.mod; then
            sudo apt-get update
            sudo apt-get install -y \
              libgl1-mesa-dev \
              xorg-dev \
              libxcursor-dev \
              libxrandr-dev \
              libxinerama-dev \
              libxi-dev \
              libxxf86vm-dev
          fi

      - name: Check for Changelog Config
        id: changelog-config
        run: |
          if [ -f "${{ inputs.changelog-config }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Changelog file exists at ${{ inputs.changelog-config }}"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Find Last Tag
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          steps.changelog-config.outputs.exists == 'true'
        id: last
        uses: jimschubert/query-tag-action@v2
        with:
          include: 'v*'
          exclude: '*-rc*'
          commit-ish: 'HEAD~'
          skip-unshallow: 'true'

      - name: Find Current Tag
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          steps.changelog-config.outputs.exists == 'true'
        id: current
        uses: jimschubert/query-tag-action@v2
        with:
          include: 'v*'
          exclude: '*-rc*'
          commit-ish: '@'
          skip-unshallow: 'true'

      - name: Create Changelog
        if: >-
          startsWith(github.ref, 'refs/tags/v') && 
          steps.changelog-config.outputs.exists == 'true'
        id: changelog
        uses: jimschubert/beast-changelog-action@v1
        with:
          CONFIG_LOCATION: ${{ inputs.changelog-config }}
          FROM: ${{ steps.last.outputs.tag }}
          TO: ${{ steps.current.outputs.tag }}

      - name: Set Release Notes Flag
        if: >-
          startsWith(github.ref, 'refs/tags/v') && 
          steps.changelog-config.outputs.exists == 'true'
        run: echo "release_notes=--release-notes=${{ github.workspace }}/.github/CHANGELOG.md" >> $GITHUB_ENV

      - name: Check for Docker Environment
        shell: bash
        id: has-docker
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ ! -z "${DOCKER_PASSWORD}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✅ Docker credentials are available"
            exit 0
          fi

      - name: Set up QEMU
        if: >-
          success() && startsWith(github.ref, 'refs/tags/v') && 
          steps.has-docker.outputs.available == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        if: >-
          success() && startsWith(github.ref, 'refs/tags/v') && 
          steps.has-docker.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: >-
          success() && startsWith(github.ref, 'refs/tags/v') && 
          steps.has-docker.outputs.available == 'true'
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: anchore/sbom-action/download-syft@v0.23.1

      - name: GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }} 
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ env.flags }} ${{ env.release_notes }}

      - name: Extract Docker image info for attestation
        id: docker-info
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Parse goreleaser artifacts to extract Docker image info
          ARTIFACTS='${{ steps.goreleaser.outputs.artifacts }}'
          
          # Check if there are any Docker images
          DOCKER_COUNT=$(echo "$ARTIFACTS" | jq '[.[] | select(.type == "Docker Image")] | length')
          
          if [ "$DOCKER_COUNT" -eq 0 ]; then
            echo "No Docker images found in artifacts"
            echo "has-docker=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get unique image digests (all tags point to same digest)
          DIGEST=$(echo "$ARTIFACTS" | jq -r '[.[] | select(.type == "Docker Image")] | .[0].extra.Digest // empty')
          
          # Get image name from first Docker image, strip the tag
          FULL_IMAGE=$(echo "$ARTIFACTS" | jq -r '[.[] | select(.type == "Docker Image")] | .[0].name // empty')
          
          if [ -z "$DIGEST" ] || [ -z "$FULL_IMAGE" ]; then
            echo "Docker image or digest not found"
            echo "has-docker=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Remove tag (everything after last colon)
          IMAGE_NAME="${FULL_IMAGE%:*}"
          
          # If no registry (no slash before image name), prepend docker.io
          if [[ "$IMAGE_NAME" != *"/"* ]]; then
            IMAGE_NAME="docker.io/$IMAGE_NAME"
          elif [[ "$IMAGE_NAME" != *"."* ]]; then
            # Has slash but no dot in registry part = Docker Hub user/image
            IMAGE_NAME="docker.io/$IMAGE_NAME"
          fi
          
          echo "has-docker=true" >> $GITHUB_OUTPUT
          echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Docker image for attestation: $IMAGE_NAME@$DIGEST"

      - name: Attest Docker Image(s) via checksums
        uses: actions/attest-build-provenance@v3.2.0
        if: >-
          startsWith(github.ref, 'refs/tags/v') && 
          steps.docker-info.outputs.has-docker == 'true' &&
          hashFiles(inputs.docker-digests-path) != ''
        with:
          subject-name: ${{ steps.docker-info.outputs.image-name }}
          subject-checksums: ${{ inputs.docker-digests-path }}
          push-to-registry: true

      - name: Attest Docker Image(s) via digest
        uses: actions/attest-build-provenance@v3.2.0
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          steps.docker-info.outputs.has-docker == 'true' &&
          hashFiles(inputs.docker-digests-path) == '' &&
          steps.docker-info.outputs.digest != ''
        with:
          subject-name: ${{ steps.docker-info.outputs.image-name }}
          subject-digest: ${{ steps.docker-info.outputs.digest }}
          push-to-registry: true
          
      - name: Attest Artifact(s)
        uses: actions/attest-build-provenance@v3.2.0
        if: >-
          startsWith(github.ref, 'refs/tags/v') && 
          hashFiles(inputs.artifact-checksums-path) != ''
        with:
          subject-checksums: ${{ inputs.artifact-checksums-path }}
