name: Mirror Docker Images
# Mirrors multi-platform Docker images from one registry to another, preserving all architectures and attestations.
# See https://docs.github.com/en/actions/sharing-automations/creating-workflow-templates-for-your-organization
# See https://github.blog/developer-skills/github/using-reusable-workflows-github-actions/
on:
  workflow_call:
    inputs:
      source-image:
        description: 'Source Docker image (e.g., jimschubert/labeler:v1.0.0)'
        required: true
        type: string
      target-image:
        description: 'Target Docker image without tag (e.g., ghcr.io/jimschubert/labeler/labeler)'
        required: true
        type: string
      target-registry:
        description: 'Target registry URL. If empty, inferred from target-image prefix (e.g., ghcr.io)'
        required: false
        type: string
        default: ''
      target-username:
        description: 'Username for target registry authentication. Defaults to github.actor for ghcr.io'
        required: false
        type: string
        default: ''
      additional-tags:
        description: 'Additional tags to apply (comma-separated, e.g., "v1,v1.2,latest")'
        required: false
        type: string
        default: ''
      create-major-tag:
        description: 'Create major version tag (v1) from source tag'
        required: false
        type: boolean
        default: true
      create-minor-tag:
        description: 'Create minor version tag (v1.2) from source tag'
        required: false
        type: boolean
        default: true
      create-latest-tag:
        description: 'Create latest tag'
        required: false
        type: boolean
        default: true
    secrets:
      target-password:
        description: 'Password/token for target registry authentication'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs and infer registry
        id: config
        run: |
          if [[ -z "${{ inputs.source-image }}" ]]; then
            echo "Error: source-image is required"
            exit 1
          fi
          if [[ -z "${{ inputs.target-image }}" ]]; then
            echo "Error: target-image is required"
            exit 1
          fi
          
          # Infer registry from target-image if not provided
          TARGET_IMAGE="${{ inputs.target-image }}"
          if [[ -n "${{ inputs.target-registry }}" ]]; then
            REGISTRY="${{ inputs.target-registry }}"
          else
            # Extract registry from image name (first segment before /)
            # e.g., ghcr.io/jimschubert/labeler -> ghcr.io
            # e.g., registry.example.com/org/app -> registry.example.com
            REGISTRY="${TARGET_IMAGE%%/*}"
            
            # If no slash found or registry looks like a Docker Hub user/org, default to docker.io
            if [[ "$REGISTRY" == "$TARGET_IMAGE" ]] || [[ ! "$REGISTRY" =~ \. ]]; then
              REGISTRY="docker.io"
            fi
          fi
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "Inferred registry: $REGISTRY"
          
          # Determine username
          if [[ -n "${{ inputs.target-username }}" ]]; then
            USERNAME="${{ inputs.target-username }}"
          else
            USERNAME="${{ github.actor }}"
          fi
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "Using username: $USERNAME"
          
          # Determine if we should use GITHUB_TOKEN as fallback
          # Only use GITHUB_TOKEN if: registry is ghcr.io AND username is github.actor AND no password provided
          if [[ "$REGISTRY" == "ghcr.io" && "$USERNAME" == "${{ github.actor }}" ]]; then
            echo "use_github_token=true" >> $GITHUB_OUTPUT
            echo "Will use GITHUB_TOKEN for authentication (ghcr.io with github.actor)"
          else
            echo "use_github_token=false" >> $GITHUB_OUTPUT
            echo "Will use provided target-password secret for authentication"
          fi

      - name: Log in to target registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.config.outputs.registry }}
          username: ${{ steps.config.outputs.username }}
          password: ${{ steps.config.outputs.use_github_token == 'true' && secrets.GITHUB_TOKEN || secrets.target-password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from source tag
        id: version
        if: inputs.create-major-tag || inputs.create-minor-tag
        run: |
          SOURCE="${{ inputs.source-image }}"
          # Extract tag from source image (after last :)
          TAG="${SOURCE##*:}"
          
          # Remove 'v' prefix if present
          VERSION="${TAG#v}"
          
          # Extract major and minor versions
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          
          echo "Extracted version info: tag=$TAG, major=$MAJOR, minor=$MINOR"

      - name: Mirror multi-platform images
        run: |
          SOURCE_IMAGE="${{ inputs.source-image }}"
          TARGET_IMAGE="${{ inputs.target-image }}"
          
          # Inspect source to verify it exists and show platforms
          echo "=== Source image platforms ==="
          docker buildx imagetools inspect "${SOURCE_IMAGE}"
          echo ""
          
          # Build tag list
          TAGS=()
          
          # Extract the tag from source image and use it on target
          SOURCE_TAG="${SOURCE_IMAGE##*:}"
          TAGS+=("--tag ${TARGET_IMAGE}:${SOURCE_TAG}")
          
          # Add version-based tags if requested
          if [[ "${{ inputs.create-major-tag }}" == "true" && -n "${{ steps.version.outputs.major }}" ]]; then
            TAGS+=("--tag ${TARGET_IMAGE}:v${{ steps.version.outputs.major }}")
          fi
          
          if [[ "${{ inputs.create-minor-tag }}" == "true" && -n "${{ steps.version.outputs.major }}" && -n "${{ steps.version.outputs.minor }}" ]]; then
            TAGS+=("--tag ${TARGET_IMAGE}:v${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}")
          fi
          
          if [[ "${{ inputs.create-latest-tag }}" == "true" ]]; then
            TAGS+=("--tag ${TARGET_IMAGE}:latest")
          fi
          
          # Add additional custom tags
          if [[ -n "${{ inputs.additional-tags }}" ]]; then
            IFS=',' read -ra EXTRA_TAGS <<< "${{ inputs.additional-tags }}"
            for tag in "${EXTRA_TAGS[@]}"; do
              # Trim whitespace
              tag=$(echo "$tag" | xargs)
              if [[ -n "$tag" ]]; then
                TAGS+=("--tag ${TARGET_IMAGE}:${tag}")
              fi
            done
          fi
          
          # Display tags that will be created
          echo "=== Creating the following tags ==="
          for tag_arg in "${TAGS[@]}"; do
            echo "  ${tag_arg#--tag }"
          done
          echo ""
          
          # Mirror all platforms with all tags
          echo "=== Mirroring multi-platform image ==="
          docker buildx imagetools create \
            "${TAGS[@]}" \
            "${SOURCE_IMAGE}"
          
          echo ""
          echo "✅ Successfully mirrored all platforms and attestations to target registry"
          
          # Verify the mirror
          echo ""
          echo "=== Verifying first target tag ==="
          FIRST_TAG="${TAGS[0]#--tag }"
          docker buildx imagetools inspect "${FIRST_TAG}"

