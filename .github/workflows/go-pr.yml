# EXAMPLE:
# jobs:
#   go-pr:
#     uses: jimschubert/.github/workflows-templates/go-pr.yml@main
#     # Optional:
#     with:
#       go-version-file: 'custom/go.mod'
#       coverage-retention-days: 7
name: Pull Request
on:
  workflow_call:
    inputs:
      go-version-file:
        description: 'Path to go.mod file for Go version'
        required: false
        type: string
        default: 'go.mod'
      golangci-lint-version:
        description: 'Version of golangci-lint to use'
        required: false
        type: string
        default: 'v2.7.2'
      coverage-artifact-name:
        description: 'Name of the coverage artifact'
        required: false
        type: string
        default: 'pr-coverage'
      coverage-retention-days:
        description: 'Number of days to retain coverage artifact'
        required: false
        type: number
        default: 3

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-go-pr
  cancel-in-progress: true

jobs:

  build:
    name: Pull Request Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:

      - name: Check out code into the Go module directory
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
        id: go

      - name: Install Fyne dependencies when needed
        uses: ./.github/actions/setup-fyne-linux

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: coverage.out
          retention-days: ${{ inputs.coverage-retention-days }}
